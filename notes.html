<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KBLC My Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:opsz,wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--green:#1DB954;--text:#EDEDED;--muted:#999;--line:#303030}*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text)}header{padding:10px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(18,18,18,.92);backdrop-filter:blur(15px);z-index:5}.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif}.brand img{width:44px;height:44px;border-radius:50%}nav{display:flex;gap:18px}nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700}nav a:hover{color:var(--green)}.container{width:min(800px,92%);margin:auto}.hero{padding:60px 0 25px}.hero h1{font-family:'Fraunces',serif;font-size:45px}.hero h1 span{color:var(--green)}.hero p{color:var(--muted);line-height:1.7}.card{background:#202020;border:1px solid var(--line);border-radius:18px;padding:25px}textarea{width:100%;min-height:400px;resize:vertical;background:#151515;color:#fff;border:1px solid #353535;border-radius:14px;padding:18px;font-family:inherit;font-size:14px;line-height:1.8;outline:none}textarea:focus{border-color:var(--green)}button{margin-top:15px;background:var(--green);border:0;border-radius:25px;padding:13px 20px;font-weight:800;cursor:pointer}.status{color:var(--green);font-size:12px;margin-left:10px}@media(max-width:650px){nav{display:none}.hero h1{font-size:38px}}
</style></head><body>
<header><div class="brand"><img src="kblc-logo.png"><span>KBLC DAILY DEVOTIONAL</span></div><nav><a href="index.html">Home</a><a href="reviews.html">Reviews</a><a href="notes.html">My Notes</a><a href="contact.html">Contact Us</a></nav></header>
<div class="container"><div class="hero"><h1>My <span>Notes.</span></h1><p>Keep your personal thoughts, prayers, Bible verses and reflections from the daily devotional.</p></div><div class="card"><textarea id="notes" placeholder="Start writing your devotional notes here..."></textarea><button onclick="saveNotes()">💾 Save Notes</button><span class="status" id="status"></span></div></div>
<script>
const KEY="kblc_daily_notes",notes=document.getElementById("notes");notes.value=localStorage.getItem(KEY)||"";
function saveNotes(){localStorage.setItem(KEY,notes.value);document.getElementById("status").textContent="✓ Notes saved";setTimeout(()=>document.getElementById("status").textContent="",2500)}
</script></body></html>
