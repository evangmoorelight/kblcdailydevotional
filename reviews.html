<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KBLC Reviews</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:opsz,wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--card:#202020;--green:#1DB954;--text:#EDEDED;--muted:#999;--line:#303030}*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;padding:10px 20px;border-bottom:1px solid var(--line);background:rgba(18,18,18,.92);backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif}.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover}nav{display:flex;gap:18px}nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700}nav a:hover{color:var(--green)}.container{width:min(800px,92%);margin:auto}.hero{padding:60px 0 25px}.hero h1{font-family:'Fraunces',serif;font-size:45px;margin:10px 0}.hero h1 span{color:var(--green)}.hero p{color:var(--muted);line-height:1.7;font-size:14px}.card{background:linear-gradient(145deg,#202020,#191919);border:1px solid var(--line);border-radius:18px;padding:25px;margin:18px 0}label{display:block;color:#ddd;font-size:13px;font-weight:700;margin-bottom:7px}input,textarea{width:100%;background:#151515;border:1px solid #353535;border-radius:12px;padding:14px;color:#fff;outline:none;font-family:inherit;margin-bottom:18px}textarea{min-height:140px;resize:vertical}input:focus,textarea:focus{border-color:var(--green)}button{background:var(--green);border:0;border-radius:25px;padding:13px 20px;font-weight:800;cursor:pointer}.message{color:var(--green);font-size:12px;margin-top:12px}.review{background:#181818;border:1px solid #303030;border-radius:14px;padding:16px;margin-top:12px}.review strong{color:#fff}.review small{color:#777;margin-left:8px}.review p{color:#ccc;line-height:1.7;font-size:13px;white-space:pre-wrap}@media(max-width:650px){nav{display:none}.hero h1{font-size:38px}}
</style></head><body>
<header><div class="brand"><img src="kblc-logo.png"><span>KBLC DAILY DEVOTIONAL</span></div><nav><a href="index.html">Home</a><a href="reviews.html">Reviews</a><a href="notes.html">My Notes</a><a href="contact.html">Contact Us</a></nav></header>
<div class="container"><div class="hero"><h1>Share Your <span>Thoughts.</span></h1><p>Leave a review or encouragement about the KBLC Daily Devotional.</p></div>
<div class="card"><h2>⭐ Leave a Review</h2><label>Your Name</label><input id="name" type="text" placeholder="Enter your name"><label>Your Review</label><textarea id="review" placeholder="Write your review or comment..."></textarea><button onclick="submitReview()">⭐ Submit Review</button><div class="message" id="message"></div></div>
<div class="card"><h2>Community Reviews</h2><div id="reviews"></div></div></div>
<script>
const KEY="kblc_daily_reviews";
function getReviews(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function saveReviews(x){localStorage.setItem(KEY,JSON.stringify(x))}
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function submitReview(){const name=document.getElementById("name").value.trim(),review=document.getElementById("review").value.trim(),msg=document.getElementById("message");if(!name||!review){msg.textContent="Please enter your name and review.";return}const data=getReviews();data.unshift({name,review,date:new Date().toLocaleDateString()});saveReviews(data);document.getElementById("name").value="";document.getElementById("review").value="";msg.textContent="✓ Thank you for your review!";display()}
function display(){const data=getReviews(),box=document.getElementById("reviews");if(!data.length){box.innerHTML='<p style="color:#777">No reviews yet. Be the first!</p>';return}box.innerHTML=data.map(x=>`<div class="review"><strong>${esc(x.name)}</strong><small>${esc(x.date)}</small><p>${esc(x.review)}</p></div>`).join("")}display();
</script></body></html>
